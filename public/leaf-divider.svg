<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 32" width="400" height="32" fill="none" role="presentation">
  <defs>
    <linearGradient id="leafRuleLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A1122A" stop-opacity="0" />
      <stop offset="100%" stop-color="#A1122A" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="leafRuleRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A1122A" stop-opacity="1" />
      <stop offset="100%" stop-color="#A1122A" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Tapering rules -->
  <rect x="0" y="15.5" width="170" height="1" fill="url(#leafRuleLeft)" />
  <rect x="230" y="15.5" width="170" height="1" fill="url(#leafRuleRight)" />

  <!-- Left leaf -->
  <path d="M200 16 C 190 8, 178 8, 174 16 C 178 24, 190 24, 200 16 Z" fill="#A1122A" />
  <path d="M176 16 H 198" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.55" stroke-linecap="round" />

  <!-- Right leaf -->
  <path d="M200 16 C 210 8, 222 8, 226 16 C 222 24, 210 24, 200 16 Z" fill="#A1122A" />
  <path d="M202 16 H 224" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.55" stroke-linecap="round" />

  <!-- Center node -->
  <circle cx="200" cy="16" r="2.25" fill="#A1122A" />
</svg>
